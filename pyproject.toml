# Settings of the two tools that read them from here: pytest and ruff. Not a
# package: the dependencies are in requirements.in, and their lock in
# requirements.txt. With this file in place, neither tool looks for settings
# in a folder above the clone.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules in src/ import each other by name, as the notebooks do.
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "spark: starts a local Spark session with Delta; needs a JDK 17 and JAVA_HOME",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# On top of ruff's defaults: import order, likely bugs, newer syntax, ruff's
# own rules, simplifications, comprehensions, pytest style and security.
#
# Left out on purpose: E501, since the formatter sets the length of code and
# what passes it is prose; ERA, which reads the # MAGIC lines of a Databricks
# notebook as commented-out code; and the style families (PL, N, D, T20, EM,
# TRY, COM), which flag print() in the notebooks, the F alias of
# pyspark.sql.functions, and the global and the deferred imports that are
# there on purpose.
extend-select = ["I", "B", "UP", "RUF", "SIM", "C4", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert.
"tests/**" = ["S101"]
