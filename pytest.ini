# Test settings for this repository. With this file in place, pytest no longer
# looks for settings in a folder above the clone.
[pytest]
testpaths = tests
# The modules in src/ import each other by name, as the notebooks do.
pythonpath = src
addopts = --strict-markers
markers =
    spark: starts a local Spark session with Delta; needs a JDK 17 and JAVA_HOME
